# Contrato del servicio de evaluaciones (fuente de verdad, guía técnica 8.8).
# Solo incluye lo implementado hasta ahora: CU-05, CU-06, CU-07 y CU-08. El resto se agrega al construirlo.
openapi: 3.0.3
info:
  title: Servicio de evaluaciones y cursos
  version: 0.1.0
servers:
  - url: http://localhost:5002
security:
  - bearer: []
paths:
  /actividades/{actividadId}/calificaciones:
    get:
      summary: Calificaciones existentes de la actividad (borradores incluidos). Quien no aparece está sin calificar.
      description: Solo el profesor dueño del curso (RN-15).
      parameters:
        - { $ref: '#/components/parameters/actividadId' }
      responses:
        '200':
          description: Lista de calificaciones, con la versión de cada una.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Calificacion' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /actividades/{actividadId}/calificaciones/{estudianteId}:
    put:
      summary: Crea o modifica la calificación de un estudiante (CU-05, CU-06, CU-07). Queda en BORRADOR.
      description: |
        - CU-05: actividad con entrega; `entregaId` referencia la entrega calificada.
        - CU-06: actividad sin entrega (parcial, sustentación); `entregaId` no se acepta.
        - CU-07: si la calificación ya existe se modifica. Si algo cambia vuelve a BORRADOR hasta publicar de nuevo.
          Un `entregaId` nulo conserva el vínculo actual. Si no cambia nada, el estado no se toca.
        - `valor` es obligatorio: 0.0 es una nota; la ausencia de nota es la ausencia de la fila (RN-08).
      parameters:
        - { $ref: '#/components/parameters/actividadId' }
        - { name: estudianteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: Versión leída de la calificación. Si cambió, 409 CONFLICTO_CONCURRENCIA.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCalificacion' }
      responses:
        '200':
          description: Calificación guardada. El encabezado ETag trae la versión nueva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calificacion' }
        '400': { $ref: '#/components/responses/Error' }   # VALIDACION_FALLIDA
        '403': { $ref: '#/components/responses/Error' }   # SIN_PERMISO
        '404': { $ref: '#/components/responses/Error' }   # NO_ENCONTRADO (actividad o estudiante no inscrito)
        '409': { $ref: '#/components/responses/Error' }   # CONFLICTO_CONCURRENCIA
        '422': { $ref: '#/components/responses/Error' }   # NOTA_FUERA_DE_RANGO
  /actividades/{actividadId}/calificaciones/publicar:
    post:
      summary: Publica las calificaciones en borrador de la actividad (CU-08).
      description: Idempotente. Sin borradores devuelve publicadas = 0. El cuerpo es opcional.
      parameters:
        - { $ref: '#/components/parameters/actividadId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                estudianteIds:
                  type: array
                  nullable: true
                  description: Si se envía, solo se publican las notas de esos estudiantes. Si no, todas las de la actividad.
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Cantidad de calificaciones publicadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actividadId: { type: string, format: uuid }
                  publicadas: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    actividadId: { name: actividadId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    GuardarCalificacion:
      type: object
      required: [valor]
      properties:
        valor: { type: number, minimum: 0, maximum: 5, multipleOf: 0.1, example: 4.5 }
        retroalimentacion: { type: string, nullable: true, maxLength: 2000 }
        entregaId: { type: string, format: uuid, nullable: true }
    Calificacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        actividadId: { type: string, format: uuid }
        estudianteId: { type: string, format: uuid }
        entregaId: { type: string, format: uuid, nullable: true }
        valor: { type: number }
        retroalimentacion: { type: string, nullable: true }
        estado: { type: string, enum: [BORRADOR, PUBLICADA] }
        version: { type: string, description: Versión de concurrencia (base64), úsala en If-Match. }
    Error:
      type: object
      properties:
        status: { type: integer }
        codigo: { type: string, example: NOTA_FUERA_DE_RANGO }
        mensaje: { type: string }
        traceId: { type: string }
  responses:
    Error:
      description: Error con el formato común (guía 8.2).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
