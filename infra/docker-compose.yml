# Entorno local completo. Desde la raíz del repositorio:
#   cp infra/.env.example infra/.env        (y edite los valores)
#   infra/scripts/generar-llaves.sh         (llaves JWT de desarrollo en infra/keys)
#   docker compose -f infra/docker-compose.yml up --build
#
# El frontend entra solo por el API Gateway (http://localhost:5000):
#   cd Frontend/Interfaz/code && VITE_API_URL=http://localhost:5000 npm run dev
name: unillanos-notas

x-jwt: &jwt
  Jwt__Issuer: unillanos-usuarios
  Jwt__Audience: unillanos-notas
  Jwt__PublicKeyPath: /keys/jwt-public.pem

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en infra/.env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: Azure.Storage.Blobs 12.30 usa una versión de API más nueva que la que reconoce Azurite.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azuritedata:/data

  # Login y emisión del JWT RS256 (usuarios de prueba solo en Development, contraseña Demo1234!).
  usuarios:
    build:
      context: ..
      dockerfile: services/usuarios/Dockerfile
    # La llave privada de desarrollo solo la puede leer su dueño (permiso 600): el contenedor corre con su UID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: unillanos-usuarios
      Jwt__Audience: unillanos-notas
      Jwt__PrivateKeyPath: /keys/jwt-private.pem
    ports:
      - "5001:8080"
    volumes:
      - ./keys:/keys:ro

  evaluaciones:
    build:
      context: ..
      dockerfile: services/evaluaciones/Dockerfile
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: Development
      Database__UseInMemory: "false"
      Database__AplicarMigraciones: "true"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=evaluaciones_db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY en infra/.env}
    ports:
      - "5002:8080"
    volumes:
      - ./keys/jwt-public.pem:/keys/jwt-public.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  entregas:
    build:
      context: ..
      dockerfile: services/entregas/Dockerfile
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=entregas_db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY en infra/.env}
      Services__EvaluacionesBaseUrl: http://evaluaciones:8080
      Services__EvaluacionesTimeoutSegundos: "3"
      # Azurite con la cuenta de desarrollo conocida, sin escribir su llave aquí.
      Storage__ConnectionString: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"
      Storage__Container: entregas
      Entregas__MaxBytes: "20971520"
      Entregas__MaxBytesTotal: "52428800"
      Entregas__MaxArchivos: "10"
      Database__AplicarMigraciones: "true"
    ports:
      - "5003:8080"
    volumes:
      - ./keys/jwt-public.pem:/keys/jwt-public.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      evaluaciones:
        condition: service_started

  # Único punto de entrada del frontend: valida el JWT, aplica CORS, bloquea /internal/** y enruta.
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *jwt
      Cors__AllowedOrigins__0: http://localhost:5173
      ReverseProxy__Clusters__usuarios__Destinations__principal__Address: http://usuarios:8080/
      ReverseProxy__Clusters__evaluaciones__Destinations__principal__Address: http://evaluaciones:8080/
      ReverseProxy__Clusters__entregas__Destinations__principal__Address: http://entregas:8080/
    ports:
      - "5000:8080"
    volumes:
      - ./keys/jwt-public.pem:/keys/jwt-public.pem:ro
    depends_on:
      - usuarios
      - evaluaciones
      - entregas

volumes:
  sqldata:
  azuritedata:
