# Entorno local. Desde infra/:
#   cp .env.example .env            (y edite los valores)
#   ./scripts/generar-llaves.sh     (llaves JWT de desarrollo en infra/keys)
#   docker compose up --build
#
# Usuarios (5001) y el API Gateway (5000) los agregan sus responsables; este archivo trae
# Evaluaciones y cursos (5002), Entregas (5003) y sus dependencias.
name: unillanos-notas

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en infra/.env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: Azure.Storage.Blobs 12.30 usa una versión de API más nueva que la que reconoce Azurite.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azuritedata:/data

  evaluaciones:
    build:
      context: ..
      dockerfile: services/evaluaciones/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=evaluaciones_db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__PublicKeyPath: /keys/jwt-publica.pem
      Jwt__Issuer: unillanos-usuarios
      Jwt__Audience: unillanos-notas
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY en infra/.env}
      Database__AplicarMigraciones: "true"
    ports:
      - "5002:8080"
    volumes:
      - ./keys/jwt-publica.pem:/keys/jwt-publica.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  entregas:
    build:
      context: ..
      dockerfile: services/entregas/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=entregas_db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__PublicKeyPath: /keys/jwt-publica.pem
      Jwt__Issuer: unillanos-usuarios
      Jwt__Audience: unillanos-notas
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY en infra/.env}
      Services__EvaluacionesBaseUrl: http://evaluaciones:8080
      Services__EvaluacionesTimeoutSegundos: "3"
      # Azurite con la cuenta de desarrollo conocida, sin escribir su llave aquí.
      Storage__ConnectionString: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"
      Storage__Container: entregas
      Entregas__MaxBytes: "20971520"
      Entregas__MaxBytesTotal: "52428800"
      Entregas__MaxArchivos: "10"
      Database__AplicarMigraciones: "true"
    ports:
      - "5003:8080"
    volumes:
      - ./keys/jwt-publica.pem:/keys/jwt-publica.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      evaluaciones:
        condition: service_started

volumes:
  sqldata:
  azuritedata:
